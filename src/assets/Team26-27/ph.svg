<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <!-- Sky Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#BAE6FD" />
      <stop offset="60%" stop-color="#E0F2FE" />
      <stop offset="100%" stop-color="#F0F9FF" />
    </linearGradient>
    
    <!-- Sun Glow -->
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FEF08A" stop-opacity="1" />
      <stop offset="100%" stop-color="#FEF08A" stop-opacity="0" />
    </radialGradient>

    <!-- Hill Gradient 1 -->
    <linearGradient id="hillGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#86EFAC" />
      <stop offset="100%" stop-color="#4ADE80" />
    </linearGradient>

    <!-- Hill Gradient 2 -->
    <linearGradient id="hillGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4ADE80" />
      <stop offset="100%" stop-color="#22C55E" />
    </linearGradient>

    <!-- Cloud Gradient -->
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#F1F5F9" stop-opacity="0.7" />
    </linearGradient>
  </defs>

  <!-- Sky background -->
  <rect width="400" height="500" fill="url(#skyGrad)" />

  <!-- Sun -->
  <circle cx="320" cy="110" r="50" fill="url(#sunGlow)" />
  <circle cx="320" cy="110" r="32" fill="#FDE047" opacity="0.9" />

  <!-- Soft Clouds -->
  <path d="M 50 140 Q 70 120 90 140 Q 110 120 140 135 Q 160 150 140 165 L 50 165 Z" fill="url(#cloudGrad)" />
  <path d="M 220 90 Q 240 75 260 90 Q 280 75 300 85 Q 315 100 295 110 L 210 110 Z" fill="url(#cloudGrad)" opacity="0.8" />

  <!-- Back Hills -->
  <path d="M -20 320 Q 90 240 220 310 Q 320 360 420 290 L 420 500 L -20 500 Z" fill="url(#hillGrad1)" />

  <!-- Front Hills -->
  <path d="M -20 380 Q 120 310 260 380 Q 350 430 420 340 L 420 500 L -20 500 Z" fill="url(#hillGrad2)" />

  <!-- Decorative Doodles on hill -->
  <path d="M 80 430 Q 85 410 90 430 M 87 418 L 95 422 M 84 422 L 77 425" stroke="#15803D" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6" />
  <path d="M 310 440 Q 315 420 320 440 M 317 428 L 325 432 M 314 432 L 307 435" stroke="#15803D" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6" />
</svg>
